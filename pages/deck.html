<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OnlyUsed 提案簡報（2026/05）</title>
<style>
:root{--pink:#FFB7C5;--pink-3:#FFF1F4;--ink:#150F15;--body:#4D3846;--line:rgba(255,183,197,.6);--page:#FAFAFA;}
@media (prefers-color-scheme:dark){:root{--pink-3:#241820;--ink:#FFE9EF;--body:#E3C8D2;--line:rgba(255,183,197,.26);--page:#0B090D;}}
body{margin:0;background:var(--page);color:var(--body);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7;}
.wrap{max-width:1000px;margin:0 auto;padding:28px 16px 64px;display:grid;gap:18px;}
h1{color:var(--ink);font-size:1.5rem;margin:0;}
.note{background:var(--pink-3);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.88rem;}
figure{margin:0;display:grid;gap:6px;}
figure img{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);}
figcaption{font-size:.8rem;color:var(--body);font-family:ui-monospace,Menlo,monospace;}
</style>
</head>
<body>
<div class="wrap">
